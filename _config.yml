title: Tobi John Olabode
tagline: Cloud FinOps Practitioner
description: >-
  Writing on cloud cost optimization, FinOps, and the data side of cloud
  financial operations across AWS, Azure and GCP.
url: "https://tobiolabode.tech"
author: Tobi John Olabode
lang: en

# Posts live under /blog/<title>/
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Apply the post layout to everything in _posts automatically,
# so a new article only needs a title and date in its front matter.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Files that should not be copied into the published site
exclude:
  - deploy.bat
  - README.md
  - "*.bat"
  - vendor
  - Gemfile
  - Gemfile.lock
